security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Checkers encadeados (tag security.user_checker.main), ex.: App\Security\JournalistStatusChecker
            user_checker: security.user_checker.chain.main
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin_dash
            logout:
                path: app_logout
            # SuperAdmin can impersonate any user
            switch_user:
                role: ROLE_SUPER_ADMIN
                parameter: _switch_user

    access_control:
        - { path: ^/jornalista/cadastro, roles: PUBLIC_ACCESS }
        - { path: ^/jornalista, roles: ROLE_JOURNALIST }
        - { path: ^/superadmin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin,      roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
