# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    # FormatExtensionResolver: evita redirect 302 — injeta URL estática com extensão .webp direto no HTML
    cache: format_extension
    twig:
        mode: legacy
    webp:
        generate: true
    filter_sets:
        cache: ~
        news_thumb:
            quality: 80
            format: webp
            filters:
                thumbnail: { size: [400, 220], mode: outbound }
        product_list:
            quality: 80
            format: webp
            filters:
                thumbnail: { size: [400, 500], mode: inset }
        admin_thumb:
            quality: 90
            filters:
                thumbnail:
                    size: [200, 200]
                    mode: inset
        hero_banner:
            quality: 75
            format: webp
            filters:
                thumbnail: { size: [1280, 720], mode: outbound }
        hero_banner_mobile:
            quality: 65
            format: webp
            filters:
                thumbnail: { size: [640, 400], mode: outbound }
